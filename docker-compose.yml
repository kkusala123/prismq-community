services:
  postgres:
    image: postgres:17-alpine
    container_name: kaoshibao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaoshibao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaoshibao_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-kaoshibao}
    volumes:
      - kaoshibao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-kaoshibao} -d $${POSTGRES_DB:-kaoshibao}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaoshibao-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kaoshibao}:${POSTGRES_PASSWORD:-kaoshibao_change_me}@postgres:5432/${POSTGRES_DB:-kaoshibao}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_APPSECRET: ${WECHAT_APPSECRET:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_UPDATE_CACHE_DIR: ${APP_UPDATE_CACHE_DIR:-/app/data/updates}
      APP_UPDATE_POLL_INTERVAL_MINUTES: ${APP_UPDATE_POLL_INTERVAL_MINUTES:-15}
    volumes:
      - ./data/updates:/app/data/updates
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  kaoshibao_pgdata:
